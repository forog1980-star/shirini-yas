<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="420" height="860" style="background:#FAF7F2; font-family:'Vazirmatn', Tahoma, sans-serif;">
  <defs>
    <linearGradient id="shaparakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Phone Frame Border -->
  <rect x="5" y="5" width="410" height="850" rx="40" fill="#ffffff" stroke="#e7e5e4" stroke-width="3" />
  
  <!-- Notch -->
  <rect x="140" y="12" width="140" height="22" rx="11" fill="#1c1917" />
  <circle cx="250" cy="23" r="4" fill="#383838" />
  <text x="375" y="26" font-size="11" font-weight="bold" fill="#78716c" text-anchor="end">10:35</text>
  <text x="35" y="26" font-size="11" fill="#78716c">5G 📶 98%</text>

  <!-- Shaparak Gateway Header -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="380" height="60" rx="18" fill="url(#shaparakGrad)" />
    <circle cx="345" cy="30" r="16" fill="#059669" />
    <text x="345" y="36" font-size="16" text-anchor="middle">🛡️</text>
    
    <text x="315" y="26" font-size="13" font-weight="900" fill="#ffffff" text-anchor="end">درگاه پرداخت امن شاپرک</text>
    <rect x="195" y="14" width="60" height="16" rx="4" fill="#10b981" fill-opacity="0.3" />
    <text x="225" y="26" font-size="9" fill="#a7f3d0" text-anchor="middle">SSL 256-bit</text>
    <text x="315" y="46" font-size="10" fill="#a7f3d0" text-anchor="end">پذیرنده رسمی: کارگاه شیرینی خانگی یاس</text>
  </g>

  <!-- Amount Bar -->
  <g transform="translate(20, 120)">
    <rect x="0" y="0" width="380" height="40" rx="12" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="365" y="25" font-size="11" fill="#047857" text-anchor="end">مبلغ تراکنش:</text>
    <text x="35" y="26" font-size="14" font-weight="900" fill="#065f46">۴۰۰,۰۰۰ تومان</text>
  </g>

  <!-- Card Form Visual -->
  <g transform="translate(20, 172)">
    <rect x="0" y="0" width="380" height="190" rx="18" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow3)" />
    
    <!-- Card Number -->
    <text x="360" y="22" font-size="11" font-weight="bold" fill="#374151" text-anchor="end">شماره ۱۶ رقمی کارت بانکی شتاب:</text>
    <rect x="15" y="28" width="350" height="36" rx="10" fill="#f9fafb" stroke="#d1d5db" />
    <text x="190" y="52" font-size="13" font-weight="bold" font-family="monospace" fill="#111827" text-anchor="middle">۶۰۳۷ - ۹۹۷۵ - ۸۴۲۱ - ۳۰۲۲</text>
    <text x="35" y="52" font-size="14">💳</text>

    <!-- CVV2 & Expiry -->
    <text x="360" y="86" font-size="10" font-weight="bold" fill="#374151" text-anchor="end">کد CVV2:</text>
    <rect x="220" y="94" width="145" height="34" rx="8" fill="#f9fafb" stroke="#d1d5db" />
    <text x="292" y="116" font-size="13" font-weight="bold" font-family="monospace" fill="#111827" text-anchor="middle">۳۸۲</text>

    <text x="180" y="86" font-size="10" font-weight="bold" fill="#374151" text-anchor="end">تاریخ انقضا (ماه / سال):</text>
    <rect x="15" y="94" width="175" height="34" rx="8" fill="#f9fafb" stroke="#d1d5db" />
    <text x="102" y="116" font-size="12" font-weight="bold" font-family="monospace" fill="#111827" text-anchor="middle">۰۸ / ۰۶</text>

    <!-- OTP Input -->
    <text x="360" y="148" font-size="10" font-weight="bold" fill="#374151" text-anchor="end">رمز یکبار مصرف پویا (OTP):</text>
    <rect x="120" y="154" width="245" height="30" rx="8" fill="#f9fafb" stroke="#d1d5db" />
    <text x="242" y="174" font-size="12" font-weight="bold" font-family="monospace" fill="#111827" text-anchor="middle">۸۴۹۲۱</text>
    <rect x="15" y="154" width="95" height="30" rx="8" fill="#047857" />
    <text x="62" y="173" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">اعتبار: ۱۱۸ ثانیه</text>
  </g>

  <!-- Payment Success Divider & Header -->
  <g transform="translate(20, 375)">
    <rect x="0" y="0" width="380" height="34" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
    <text x="355" y="22" font-size="14">✅</text>
    <text x="330" y="22" font-size="11" font-weight="900" fill="#065f46" text-anchor="end">پرداخت موفق با کد رهگیری TRK-9832711</text>
    <text x="20" y="22" font-size="10" fill="#047857">سامانه شاپرک</text>
  </g>

  <!-- DUAL SMS NOTIFICATION SHOWCASE -->
  <g transform="translate(20, 425)">
    <rect x="0" y="0" width="380" height="400" rx="22" fill="#1c1917" />
    
    <!-- Toast Header -->
    <circle cx="345" cy="28" r="14" fill="#f59e0b" fill-opacity="0.2" />
    <text x="345" y="34" font-size="14" text-anchor="middle">🔔</text>
    <text x="315" y="26" font-size="12" font-weight="900" fill="#fef08a" text-anchor="end">ارسال همزمان دو پیامک هوشمند</text>
    <text x="315" y="42" font-size="9" fill="#a8a29e" text-anchor="end">متصل به وب‌سرویس پیامکی پس از ثبت پرداخت شاپرک</text>

    <!-- 1. BUYER SMS PHONE BUBBLE -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="350" height="150" rx="16" fill="#292524" stroke="#44403c" />
      
      <circle cx="325" cy="22" r="10" fill="#10b981" fill-opacity="0.2" />
      <text x="325" y="27" font-size="12" text-anchor="middle">📱</text>
      <text x="305" y="26" font-size="11" font-weight="bold" fill="#34d399" text-anchor="end">پیامک دریافتی خریدار (۰۹۱۲۹۸۷۶۵۴۳)</text>
      <text x="20" y="26" font-size="9" fill="#78716c">۱۰:۳۶</text>

      <rect x="15" y="40" width="320" height="98" rx="12" fill="#1c1917" stroke="#383838" />
      <text x="315" y="60" font-size="10" fill="#e7e5e4" text-anchor="end">علیرضا رضایی عزیز، پرداخت سفارش #SH-8491</text>
      <text x="315" y="78" font-size="10" fill="#e7e5e4" text-anchor="end">به مبلغ ۴۰۰,۰۰۰ تومان با موفقیت تایید شد.</text>
      <text x="315" y="96" font-size="10" fill="#fde68a" text-anchor="end">شیرینی شما در نوبت پخت قرار گرفت و فردا عصر ارسال می‌گردد.</text>
      <text x="315" y="114" font-size="9" fill="#a8a29e" text-anchor="end">کد پیگیری: TRK-9832711 - کارگاه شیرینی خانگی یاس</text>
      <text x="315" y="128" font-size="9" fill="#34d399" text-anchor="end">✓ پیامک تحویل داده شد (سرشماره ۱۰۰۰۸۴۹)</text>
    </g>

    <!-- 2. SELLER / BAKER SMS PHONE BUBBLE -->
    <g transform="translate(15, 225)">
      <rect x="0" y="0" width="350" height="155" rx="16" fill="#451a03" stroke="#78350f" />
      
      <circle cx="325" cy="22" r="10" fill="#f59e0b" fill-opacity="0.3" />
      <text x="325" y="27" font-size="12" text-anchor="middle">🔔</text>
      <text x="305" y="26" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="end">پیامک هشدار فوری به مدیریت یاس</text>
      <text x="20" y="26" font-size="9" fill="#a8a29e">۱۰:۳۶</text>

      <rect x="15" y="40" width="320" height="102" rx="12" fill="#1c1917" stroke="#78350f" />
      <text x="315" y="60" font-size="10" font-weight="bold" fill="#fef08a" text-anchor="end">سفارش جدید دریافتی! سفارش #SH-8491</text>
      <text x="315" y="78" font-size="10" fill="#f5f5f4" text-anchor="end">مبلغ ۴۰۰,۰۰۰ تومان به حساب واریز شد.</text>
      <text x="315" y="96" font-size="10" fill="#fed7aa" text-anchor="end">اقلام: ۱ کیلو شیرینی تر نان‌خامه‌ای (کم‌شیرین)</text>
      <text x="315" y="114" font-size="10" fill="#fed7aa" text-anchor="end">زمان تحویل: فردا عصر (۱۷ الی ۲۰) | تحویل‌گیرنده: علیرضا رضایی</text>
      <text x="315" y="132" font-size="9" fill="#fbbf24" text-anchor="end">لطفاً در پنل کارگاه نوبت پخت فر را تایید فرمایید.</text>
    </g>
  </g>
</svg>
